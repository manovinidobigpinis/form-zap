<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Form-Zap</title>
</head>
<body>
    <section class="tudin">
        <div class="inicio">
            <img src="../images/whatsapp.png" alt="img01" width="40px">
            <h1>Empresa</h1>
        </div>
        <p>Olá! Insira seus dados para ser direcionado para o WhatsApp:</p>
        <div class="form">
            <label for="nome">Seu Nome</label>
            <input type="text" id="nome" placeholder="Digite seu nome">
            <br>
            <label for="gmail">Seu e-mail</label>
            <input type="email" id="email" placeholder="exemplo@email.com">
            <br>
            <label for="whats">Seu WhatsApp</label>
            <input type="tel" id="numero" placeholder="+55 (99) 4002-8922">
            <br>
            <button onclick="mensagem()">Ir para o WhatsApp</button>
        </div>
    </section>
    <footer>
        <script src="script.js"></script>
    </footer>
</body>
</html>
